
<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>卒研 Web版</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<main>

    <!-- ログイン画面 -->
    <section id="login">
        <h1>ログイン</h1>

        <input id="user" placeholder="ユーザー名">
        <input id="pass" type="password" placeholder="パスワード">

        <button onclick="login()">ログイン</button>
        <button onclick="show('register')">新規登録</button>

        <p id="loginMsg"></p>
    </section>

    <!-- 新規登録画面 -->
    <section id="register" hidden>
        <h1>新規登録</h1>

        <input id="ruser" placeholder="ユーザー名">
        <input id="rpass" type="password" placeholder="パスワード">

        <button onclick="register()">登録</button>
        <button onclick="show('login')">ログイン画面に戻る</button>

        <p id="registerMsg"></p>
    </section>

    <!-- ホーム画面 -->
    <section id="home" hidden>
        <h1>ホーム画面</h1>
        <p>ログイン中: <b id="who"></b></p>

        <!-- チャット -->
        <h2>チャット</h2>

        <input id="chat" placeholder="メッセージ">

        <button onclick="sendMessage()">メッセージ送信</button>
        <button onclick="getMessages()">メッセージ取得</button>

        <div id="messages"></div>

        <!-- カレンダー -->
        <h2>カレンダー</h2>

        <label for="calendarSelect">
            使用するカレンダー：
        </label>

        <select id="calendarSelect" onchange="loadEvents()">
            <option value="">
                カレンダーを選択してください
            </option>
        </select>

        <button onclick="loadCalendars()">一覧を更新</button>

        <button onclick="createCalendar()">カレンダー作成</button>
        <button onclick="getCalendar()">カレンダー取得</button>
        <button onclick="createEvent()">イベント作成</button>

        <p id="status"></p>

        <h3>予定一覧</h3>
        <button onclick="loadEvents()">予定一覧を更新</button>
        <p id="eventsStatus" role="status">カレンダーを選択してください</p>
        <ul id="eventList"></ul>

        <!-- AI予定抽出 -->
        <h2>AI予定抽出</h2>

        <textarea
            id="eventText"
            placeholder="例：明日の14時から16時まで図書館で勉強する"
            rows="4"
        ></textarea>

        <button onclick="extractEvents()">
            AIで予定を抽出
        </button>

        <h3>抽出結果</h3>
        <div id="extractResult"></div>

        <!-- ログアウト -->
        <button class="logout" onclick="logout()">
            ログアウト
        </button>
    </section>

</main>

<script src="app.js"></script>
</body>
</html>
