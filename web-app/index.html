<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>卒研 Web版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <nav id="appNavigation" aria-label="メインメニュー" hidden>
        <button onclick="show('home')" data-screen="home">ホーム</button>
        <button onclick="show('chatScreen')" data-screen="chatScreen">チャット</button>
        <button onclick="show('calendarScreen')" data-screen="calendarScreen">カレンダー</button>
        <button onclick="show('aiScreen')" data-screen="aiScreen">AI予定候補</button>
        <button class="logout" onclick="logout()">ログアウト</button>
    </nav>
    <!-- ログイン画面 -->
    <section id="login" hidden>
        <h1>ログイン</h1>

        <input id="user" placeholder="ユーザー名">
        <input id="pass" type="password" placeholder="パスワード">

        <button onclick="login()">ログイン</button>
        <button onclick="show('register')">新規登録</button>

        <p id="loginMsg"></p>
    </section>

    <!-- 新規登録画面 -->
    <section id="register" hidden>
        <h1>新規登録</h1>

        <input id="ruser" placeholder="ユーザー名">
        <input id="rpass" type="password" placeholder="パスワード">

        <button onclick="register()">登録</button>
        <button onclick="show('login')">ログイン画面に戻る</button>

        <p id="registerMsg"></p>
    </section>


    <section id="sessionCheck" hidden>
        <h1 tabindex="-1">ログイン状態の確認</h1>
        <p id="sessionMessage" role="status">サーバーに確認しています...</p>
        <button id="sessionRetry" onclick="verifySession()" hidden>再接続する</button>
        <button onclick="logout()">ログイン画面に戻る</button>
    </section>

    <section id="home" hidden>
        <h1 tabindex="-1">ホーム</h1>
        <p>ログイン中: <b id="who"></b></p>
        <p>使いたい機能を選んでください。</p>
        <div class="home-menu">
            <button onclick="show('chatScreen')">チャット<span>メッセージを送る・読む</span></button>
            <button onclick="show('calendarScreen')">カレンダー<span>予定を確認する・手動で登録する</span></button>
            <button onclick="show('aiScreen')">AI予定候補<span>文章から予定を抽出して確認・登録する</span></button>
        </div>
    </section>

    <div id="calendarContext" class="calendar-context" hidden>
        <label for="calendarSelect">使用するカレンダー</label>
        <select id="calendarSelect" onchange="loadEvents()">
            <option value="">カレンダーを選択してください</option>
        </select>
        <button onclick="loadCalendars()">カレンダー一覧を更新</button>
        <p id="status" role="status"></p>
    </div>

    <section id="chatScreen" hidden>
        <h1 tabindex="-1">チャット</h1>
        <label for="chat">メッセージ</label>
        <input id="chat" placeholder="メッセージ">
        <button onclick="sendMessage()">メッセージ送信</button>
        <button onclick="getMessages()">メッセージ取得</button>
        <p id="chatStatus" role="status"></p>
        <div id="messages"></div>
        <button class="back-home" onclick="show('home')">ホームへ戻る</button>
    </section>

    <section id="calendarScreen" hidden>
        <h1 tabindex="-1">カレンダー</h1>
        <button onclick="createCalendar()">カレンダー作成</button>
        <button onclick="getCalendar()">カレンダー情報を取得</button>
        <h3>予定を手動で登録</h3>
        <form id="eventForm" onsubmit="event.preventDefault(); window.createEvent();">
            <p>開始・終了日時は日本時間で入力してください。</p>
            <label for="manualTitle">タイトル（必須）</label>
            <input id="manualTitle" type="text" required>
            <label for="manualStart">開始日時（必須・日本時間）</label>
            <input id="manualStart" type="datetime-local" step="60" required>
            <label for="manualEnd">終了日時（必須・日本時間）</label>
            <input id="manualEnd" type="datetime-local" step="60" required>
            <label for="manualLocation">場所（任意）</label>
            <input id="manualLocation" type="text">
            <label for="manualDescription">説明（任意）</label>
            <textarea id="manualDescription" rows="3"></textarea>
            <button id="createEventButton" type="submit">予定を登録</button>
            <p id="manualEventStatus" role="status"></p>
        </form>

        <h3>予定一覧</h3>
        <button onclick="loadEvents()">予定一覧を更新</button>
        <p id="eventsStatus" role="status">カレンダーを選択してください</p>
        <ul id="eventList"></ul>


        <button onclick="show('aiScreen')">AIで予定を抽出する</button>
        <button class="back-home" onclick="show('home')">ホームへ戻る</button>
    </section>

    <section id="aiScreen" hidden>
        <h1 tabindex="-1">AI予定候補</h1>
        <p>文章から予定を抽出し、内容と登録先を確認して登録します。</p>
        <label for="eventText">予定が書かれた文章</label>
        <textarea
            id="eventText"
            placeholder="例：明日の14時から16時まで図書館で勉強する"
            rows="4"
        ></textarea>

        <button onclick="extractEvents()">
            AIで予定を抽出
        </button>

        <h3>抽出結果</h3>
        <div id="extractResult"></div>


        <button onclick="show('calendarScreen')">カレンダーで予定一覧を確認</button>
        <button class="back-home" onclick="show('home')">ホームへ戻る</button>
    </section>
</main>
<script src="app.js"></script>
</body>
</html>
